<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <header class="w-full max-w-6xl mb-8 flex flex-col md:flex-row justify-between items-center border-b-2 border-yellow-600 pb-4 gap-4">
        <div>
            <h1 class="text-3xl font-bold text-yellow-500">ГАРАЖ01 // PURE_VOICE</h1>
            <p class="text-sm text-gray-400 italic">Полный рихтовочный комплекс. Голая суть под озвучку TTS.</p>
        </div>
        <div class="flex flex-col md:flex-row items-center gap-4">
            <!-- Голубая кнопка скачивания самой программы -->
            <button onclick="downloadCleanerApp()" class="btn-download px-5 py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider flex items-center space-x-2 shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
                <span>СКАЧАТЬ CLEANER.HTML</span>
            </button>
            <div class="text-right text-zinc-500 text-xs hidden md:block">
                BUILD: 4.1_FIXED <br>
                STANDALONE_TOOL
            </div>
        </div>
    </header>

    <main class="w-full max-w-6xl grid grid-cols-1 md:grid-cols-2 gap-6 flex-grow">
        <!-- ВХОД -->
        <div class="flex flex-col space-y-2">
            <div class="flex justify-between items-end">
                <label class="text-xs font-bold uppercase tracking-widest text-gray-500 ml-1">Исходный хлам (формулы, сноски [30-32], маркдаун)</label>
                <button onclick="resetField('inputText')" class="text-[10px] uppercase font-bold px-2 py-1 rounded btn-reset">Сбросить вход</button>
            </div>
            <div class="garage-border rounded-lg bg-zinc-900 overflow-hidden flex-grow flex">
                <textarea id="inputText" placeholder="Закидывай сюда сырой текст с академическими сносками [30-32], формулами и маркдауном..." class="w-full h-64 md:h-[500px] p-4 bg-transparent outline-none resize-none text-zinc-300"></textarea>
            </div>
        </div>

        <!-- ВЫХОД -->
        <div class="flex flex-col space-y-2">
            <div class="flex justify-between items-end">
                <label class="text-xs font-bold uppercase tracking-widest text-yellow-600 ml-1">Чистый выхлоп</label>
                <button onclick="resetField('outputText')" class="text-[10px] uppercase font-bold px-2 py-1 rounded btn-reset">Очистить выход</button>
            </div>
            <div class="garage-border rounded-lg bg-zinc-900 overflow-hidden flex-grow flex relative">
                <textarea id="outputText" readonly="" placeholder="Здесь будет монолитный текст без заусенцев..." class="w-full h-64 md:h-[500px] p-4 bg-zinc-900/50 outline-none resize-none text-yellow-100 font-bold leading-relaxed"></textarea>
                <div id="copyStatus" class="absolute bottom-4 right-4 text-xs font-bold text-yellow-400 hidden bg-black/90 border border-yellow-600/50 px-3 py-1.5 rounded shadow-xl">
                    ✓ СНЯТО С ВЕРСТАКА В БУФЕР!
                </div>
            </div>
        </div>
 main&gt;

    <!-- КНОПКИ УПРАВЛЕНИЯ -->
    <section class="w-full max-w-6xl mt-8 flex flex-col md:flex-row gap-4">
        <button onclick="cleanText()" class="btn-hammer flex-[2] py-4 rounded-lg flex items-center justify-center space-x-2 hover:bg-yellow-500 transition-colors shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
            <span>ОБРАБОТАТЬ КУВАЛДОЙ</span>
        </button>
        
        <button onclick="copyToClipboard()" class="bg-zinc-800 flex-1 hover:bg-zinc-700 text-white px-8 py-4 rounded-lg flex items-center justify-center space-x-2 transition-colors border border-zinc-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
            </svg>
            <span>КОПИРОВАТЬ</span>
        </button>
    </section>

    <script>
        function resetField(id) {
            document.getElementById(id).value = '';
        }

        function cleanText() {
            let text = document.getElementById('inputText').value;
            if (!text) return;

            // 1. ДЕШИФРОВКА LaTeX И ФОРМУЛ
            text = text.replace(/\\text\{([^\}]+)\}/g, ' $1 ');
            text = text.replace(/\\(to|rightarrow)/g, ' в ');
            text = text.replace(/\\Delta/g, ' дельта ');
            text = text.replace(/\\alpha/g, ' альфа ');
            text = text.replace(/\\beta/g, ' бета ');
            text = text.replace(/\\gamma/g, ' гамма ');
            text = text.replace(/(\w)'/g, '$1 штрих ');
            text = text.replace(/\\[a-zA-Z]+/g, ' ');

            // 2. ВЫРЕЗАНИЕ ЧИСЛОВЫХ СНОСОК И ССЫЛОК [30-32], [1], [1, 2, 5], [10–15]
            text = text.replace(/\[\d+[\d\s,–\-\.]*\]/g, '');

            // 3. МАРКДАУН ССЫЛКИ [Заголовок](http://...) -> оставляем только "Заголовок"
            text = text.replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1');

            // 4. УДАЛЕНИЕ ГОРИЗОНТАЛЬНЫХ ЛИНИЙ (---, ***, ___)
            text = text.replace(/^\s*[-*_]{3,}\s*$/gm, '');

            // 5. ОЧИСТКА ЗАГОЛОВКОВ, ЦИТАТ И СПИСКОВ В НАЧАЛЕ СТРОК
            text = text.replace(/^#+\s+/gm, '');           // Заголовки # ## ###
            text = text.replace(/^\s*>\s+/gm, '');            // Цитаты >
            text = text.replace(/^\s*[-+*•]\s+/gm, '');       // Маркированные списки -, +, *, •
            text = text.replace(/^\s*\d+[\.\)]\s+/gm, '');    // Нумерованные списки 1., 1)

            // 6. УДАЛЕНИЕ ОСТАТОЧНОЙ МАРКДАУН-РАЗМЕТКИ И МУСОРНЫХ СИМВОЛОВ
            text = text.replace(/[\*\_\~`^\\|<>]+/g, '');     // Жирный, курсив, зачеркнутый, код, таблицы
            text = text.replace(/[@$#]/g, ' ');               // Символы @, $, #
            text = text.replace(/[\{\}\[\]]/g, '');            // Оставшиеся скобки {}, []
            text = text.replace(/(^|\s)\+(?=\s|$)/g, ' ');    // Одиночные плюсы
            text = text.replace(/(^|\s)-(?=\s|$)/g, ' ');     // Одиночные тире/минусы (отделенные пробелами)

            // 7. НОРМАЛИЗАЦИЯ ПРОБЕЛОВ И АБЗАЦЕВ
            let clean = text
                .replace(/[ \t]+/g, ' ')                      // Множественные пробелы в один
                .replace(/[ \t]+$/gm, '')                     // Лишние пробелы в конце строк
                .replace(/\n{3,}/g, '\n\n')                   // Не более двух переносов подряд
                .trim();

            document.getElementById('outputText').value = clean;
        }

        function showStatus() {
            const status = document.getElementById('copyStatus');
            status.classList.remove('hidden');
            setTimeout(() => status.classList.add('hidden'), 2200);
        }

        function copyToClipboard() {
            const output = document.getElementById('outputText');
            if (!output.value) return;

            // Временно снимаем readonly для гарантии захвата на iOS/Android и в iFrame
            output.removeAttribute('readonly');
            output.focus();
            output.select();
            output.setSelectionRange(0, 999999);

            let success = false;
            try {
                // Главный рабочий инструмент в фреймах
                success = document.execCommand('copy');
            } catch (err) {
                console.error('Ошибка копирования execCommand:', err);
            }

            // Восстанавливаем защиту поля от дурного редактирования
            output.setAttribute('readonly', 'readonly');

            if (success) {
                showStatus();
            } else if (navigator.clipboard) {
                // Резервный канал
                navigator.clipboard.writeText(output.value)
                    .then(() => showStatus())
                    .catch(() => {
                        // Если оба способа не прошли - оставляем текст выделенным для ручного Ctrl+C
                    });
            }
        }

        function downloadCleanerApp() {
            const docClone = document.cloneNode(true);
            const inArea = docClone.getElementById('inputText');
            const outArea = docClone.getElementById('outputText');
            if (inArea) inArea.value = '';
            if (outArea) outArea.value = '';

            const htmlContent = "<!DOCTYPE html>\n" + docClone.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'cleaner_v4.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
