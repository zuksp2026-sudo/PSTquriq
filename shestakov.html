            ),
            Hash: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></svg>
            ),
            AlertCircle: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
            )
        };

        const App = () => {
            const [keySource, setKeySource] = useState('custom');
            const [userApiKey, setUserApiKey] = useState(localStorage.getItem('jpb_gemini_key') || '');
            const [dnaText, setDnaText] = useState('');
            const [dnaFiles, setDnaFiles] = useState(0);
            const [victimText, setVictimText] = useState('');
            const [victimFiles, setVictimFiles] = useState(0);
            const [outputText, setOutputText] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [isParsing, setIsParsing] = useState(null);
            const [error, setError] = useState('');
            const [copied, setCopied] = useState(false);
            const [currentModelName, setCurrentModelName] = useState('gemini-flash-latest');
            
            const dnaInputRef = useRef(null);
            const victimInputRef = useRef(null);
            const keyInputRef = useRef(null);

            const systemInstruction = `
                ТЫ — ЕВГЕНИЙ ШЕСТАКОВ В РЕЖИМЕ "СУПЕРЧАРДЖЕР" (5000 ВОЛЬТ).
                У тебя есть два источника данных: "ДНК СТИЛЯ" и "ЖЕРТВА".

                ТВОЯ ЗАДАЧА:
                1. Проанализируй "ДНК СТИЛЯ". Впитай манеру, словарь, ритм и ядовитость этого автора. Стань им. Не пересказывай его, а используй его ДНК как топливо.
                2. Используя впитанную манеру и свой классический Шестаковский натиск, полностью перепиши текст "ЖЕРТВЫ".
                3. ПРИНЦИП "ПОКАЗЫВАНИЕ": Никакого информирования. Наращивай мясо на скелет "Жертвы". Окружай центральную мысль армадой образов.
                4. РИТМ И ГРАДИЕНТЫ: Американские горки. Пулеметная очередь коротких фраз. Бешеное сжатие смыслов в точку и растягивание до бесконечности.
                5. Используй экспрессивные выражения, если это придает тексту нужную шершавость.

                ОБЯЗАТЕЛЬНО:
                - Сохраняй термины: F-оператор, Орех, Мотолок.
                - ПОКАЗЫВАЙ ФИЗИКУ. Хруст, визг, вонь, искры.

                ЗАПРЕТЫ: НИКАКИХ КЛИШЕ. НИКАКОЙ РАЗМЕТКИ (MARKDOWN). НИКАКОЙ ВЕЖЛИВОСТИ.
            `;

            const handleKeyUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const key = e.target.result.trim();
                    setUserApiKey(key);
                    localStorage.setItem('jpb_gemini_key', key);
                };
                reader.readAsText(file);
            };

            const handlePdfUpload = async (event, target) => {
                const files = Array.from(event.target.files);
                if (!files.length) return;
                setIsParsing(target);
                setError('');
                
                let combinedText = target === 'dna' ? dnaText : victimText;
                let count = target === 'dna' ? dnaFiles : victimFiles;

                try {
                    for (const file of files) {
                        if (file.type !== 'application/pdf') continue;
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        let text = '';
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const content = await page.getTextContent();
                            text += content.items.map(item => item.str).join(' ') + '\n\n';
                        }
                        combinedText = combinedText ? combinedText + "\n\n" + text.trim() : text.trim();
                        count++;
                    }
                    
                    if (target === 'dna') {
                        setDnaText(combinedText);
                        setDnaFiles(count);
                    } else {
                        setVictimText(combinedText);
                        setVictimFiles(count);
                    }
                } catch (err) {
                    setError(`Ошибка вскрытия: ${err.message}`);
                } finally {
                    setIsParsing(null);
                }
            };

            // Динамический автоподбор свежей доступной Flash-модели через ListModels API
            const fetchAvailableFlashModel = async (apiKey) => {
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
                    if (!res.ok) return null;
                    const data = await res.json();
                    if (!data.models) return null;

                    // Ищем любую модель типа flash, умеющую генерировать контент
                    const flashModel = data.models.find(m => 
                        m.name.includes('flash') && 
                        m.supportedGenerationMethods?.includes('generateContent')
                    );

                    if (flashModel) {
                        // Отрезаем префикс "models/"
                        return flashModel.name.replace('models/', '');
                    }
                } catch (e) {
                    console.warn('Автопоиск моделей не удался:', e);
                }
                return null;
            };

            const processText = async () => {
                const activeKey = keySource === 'auto' ? '' : userApiKey.trim();
                if (keySource === 'custom' && !activeKey) { setError('ГДЕ КЛЮЧ? БАК ПУСТ!'); return; }
                if (!victimText.trim()) { setError('ГДЕ ЖЕРТВА? ВЕРСТАК ПУСТ!'); return; }

                setIsLoading(true);
                setError('');

                const callApi = async (modelName, isRetry = false) => {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${activeKey}`;
                    setCurrentModelName(modelName);

                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: `ДНК СТИЛЯ:\n${dnaText || "Используй свой стандартный стиль"}\n\nЖЕРТВА:\n${victimText}\n\nЗАДАНИЕ: ПЕРЕПИШИ ЖЕРТВУ.` }] }],
                                systemInstruction: { parts: [{ text: systemInstruction }] },
                                generationConfig: { temperature: 1.0, maxOutputTokens: 8192 }
                            })
                        });

                        const data = await response.json();
                        if (!response.ok) {
                            // Если не нашли модель или она не поддерживается — ищем текущую свежую через ListModels
                            if (!isRetry && (response.status === 404 || data.error?.message?.includes('not found') || data.error?.message?.includes('not available'))) {
                                const dynamicModel = await fetchAvailableFlashModel(activeKey);
                                if (dynamicModel) {
                                    return await callApi(dynamicModel, true);
                                }
                            }
                            throw new Error(data.error?.message || 'Ошибка API');
                        }
                        return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                    } catch (err) {
                        if (!isRetry) {
                            const dynamicModel = await fetchAvailableFlashModel(activeKey);
                            if (dynamicModel) {
                                return await callApi(dynamicModel, true);
                            }
                        }
                        throw err;
                    }
                };

                try {
                    // Сначала дергаем вечный алиас 'gemini-flash-latest'
                    const result = await callApi('gemini-flash-latest');
                    setOutputText(result.replace(/\*/g, '').replace(/#/g, '').trim());
                } catch (err) {
                    setError(`Разрыв цепи: ${err.message}`);
                } finally {
                    setIsLoading(false);
                }
            };

            const copyResult = () => {
                const el = document.createElement('textarea');
                el.value = outputText;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            return (
                <div className="min-h-screen p-4 md:p-8 bg-white">
                    <div className="max-w-6xl mx-auto space-y-6">
                        
                        {/* Шапка */}
                        <header className="border-b-4 border-red-600 pb-6 flex flex-col md:flex-row items-center justify-between gap-6">
                            <div className="flex items-center gap-4">
                                <div className="p-4 bg-yellow-400 border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] animate-pulse">
                                    <Icons.Zap size={40} className="text-black fill-black" />
                                </div>
                                <div className="text-left">
                                    <h1 className="text-3xl font-black uppercase italic tracking-tighter leading-none text-black">ГAPAЖ-01</h1>
                                    <p className="text-[10px] text-red-600 font-bold uppercase tracking-[0.3em] mt-1 italic underline decoration-black underline-offset-4">v17.1 INSTRUMENTS</p>
                                </div>
                            </div>
                            
                            <div className="w-full md:w-96 space-y-2 text-left bg-zinc-50 border-2 border-zinc-200 p-3 rounded-2xl">
                                <div className="flex justify-between items-center mb-1">
                                    <label className="text-[9px] font-black uppercase text-zinc-500 block tracking-widest italic">Источник Питания API</label>
                                    {keySource === 'custom' && (
                                        <button 
                                            onClick={() => keyInputRef.current?.click()}
                                            className="text-[9px] font-black uppercase text-red-600 hover:underline flex items-center gap-1"
                                        >
                                            <Icons.Key size={10} /> .txt Ключ
                                        </button>
                                    )}
                                </div>

                                {/* ТУМБЛЕР ПЕРЕКЛЮЧЕНИЯ */}
                                <div className="grid grid-cols-2 bg-zinc-200 p-1 rounded-xl gap-1 text-[10px] font-black uppercase">
                                    <button
                                        onClick={() => setKeySource('custom')}
                                        className={`py-1.5 rounded-lg transition-all flex items-center justify-center gap-1.5 ${
                                            keySource === 'custom'
                                                ? 'bg-black text-white shadow-sm'
                                                : 'text-zinc-600 hover:text-black'
                                        }`}
                                    >
                                        <Icons.Key size={12} />
                                        Мой Ключ
                                    </button>
                                    <button
                                        onClick={() => setKeySource('auto')}
                                        className={`py-1.5 rounded-lg transition-all flex items-center justify-center gap-1.5 ${
                                            keySource === 'auto'
                                                ? 'bg-red-600 text-white shadow-sm'
                                                : 'text-zinc-600 hover:text-black'
                                        }`}
                                    >
                                        <Icons.Zap size={12} className={keySource === 'auto' ? 'fill-white' : ''} />
                                        Мастерская (Авто)
                                    </button>
                                </div>
