            border-color: #ffedd5;
            white-space: nowrap;
        }

        .f3-btn {
            font-size: 0.65rem;
            padding: 0 8px;
            height: 32px;
            color: #0369a1;
            background: #f0f9ff;
            border-color: #bae6fd;
            white-space: nowrap;
        }

        .f3-btn:active {
            background-color: #0284c7;
            color: white;
            border-color: #0369a1;
        }

        #mainEditor {
            flex: 1;
            width: 100%;
            padding: 12px;
            font-size: 18px;
            line-height: 1.5;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            font-family: 'JetBrains+Mono', monospace;
        }

        .toolbar {
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        /* Ряд кнопок-категорий (переключатели панелей) */
        .cat-row {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding: 6px 6px 4px;
            -webkit-overflow-scrolling: touch;
            border-bottom: 1px solid var(--border);
        }

        .cat-btn {
            transition: all 0.1s ease;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            border: 1px solid var(--border);
            background: #ffffff;
            color: #475569;
            font-weight: 800;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            padding: 7px 10px;
            border-radius: 6px;
        }

        .cat-btn i { font-size: 9px; }

        .cat-btn.active {
            background: var(--orange);
            color: #ffffff;
            border-color: #ea580c;
        }

        .cat-btn.cat-f3.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #0369a1;
        }

        .cat-btn:active { transform: scale(0.94); }

        /* Панели с символами */
        .panel {
            display: none;
        }
        .panel.open {
            display: flex;
            max-height: 120px;
            overflow-y: auto;
            align-content: flex-start;
        }

        .scroll-row {
            gap: 4px;
            overflow-x: auto;
            padding: 6px;
            -webkit-overflow-scrolling: touch;
            flex-wrap: wrap;
        }

        .custom-scrollbar::-webkit-scrollbar { height: 3px; width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            transition: transform 0.3s ease;
            z-index: 100;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        #confirmModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
    </style>

<body>

    <!-- ШАПКА -->
    <header class="px-2 py-2 border-b border-slate-200 bg-white flex items-center justify-between shadow-sm z-50">
        <div class="flex items-center gap-1.5 overflow-hidden">
            <div class="bg-orange-600 p-1.5 rounded shrink-0">
                <i class="fas fa-bolt text-white text-[10px]"></i>
            </div>
            <h1 class="font-black text-slate-900 italic text-[11px] tracking-tighter uppercase truncate">JPB Math Pad Pro <span class="text-sky-600">Ф3</span></h1>
        </div>
    </header>

    <!-- ИНСТРУМЕНТАЛЬНАЯ ПАНЕЛЬ -->
    <div class="toolbar">

        <!-- КНОПКИ-КАТЕГОРИИ -->
        <div class="cat-row custom-scrollbar">
            <button onclick="togglePanel('panel-f3', this)" class="cat-btn cat-f3 active" data-panel="panel-f3">
                <i class="fas fa-atom"></i> Ф3 (3-й Цех)
            </button>
            <button onclick="togglePanel('panel-formulas', this)" class="cat-btn" data-panel="panel-formulas">
                <i class="fas fa-square-root-variable"></i> Формулы
            </button>
            <button onclick="togglePanel('panel-greek', this)" class="cat-btn" data-panel="panel-greek">
                <i class="fas fa-font"></i> Буквы
            </button>
            <button onclick="togglePanel('panel-math', this)" class="cat-btn" data-panel="panel-math">
                <i class="fas fa-infinity"></i> Матзнаки
            </button>
            <button onclick="togglePanel('panel-quriq', this)" class="cat-btn" data-panel="panel-quriq">
                <i class="fas fa-cubes"></i> QURIQ
            </button>
        </div>

        <!-- ПАНЕЛЬ: ФОРМУЛЫ ТРЕТЬЕГО ЦЕХА (Ф3) -->
        <div id="panel-f3" class="panel scroll-row custom-scrollbar open">
            <!-- Категориальный блок -->
            <button onclick="insert('Q1_пс → Q2_пс (где Q1_пс=R_нс, Q2_пс=I_нс)')" class="symbol-btn f3-btn" title="1. Морфизм перехода">1. Q1_пс → Q2_пс</button>
            <button onclick="insert('F → F\'')" class="symbol-btn f3-btn" title="2. Физический эквивалент морфизма">2. F → F\'</button>
            <button onclick="insert('Φ_z : O → P (O → R_min)')" class="symbol-btn f3-btn" title="3. Забирающий функтор">3. Φ_z : O → P</button>
            <button onclick="insert('Φ_o ⊣ Φ_z')" class="symbol-btn f3-btn" title="4. Сопряжение функторов">4. Φ_o ⊣ Φ_z</button>
            <button onclick="insert('Hom_P(P1, P2) ≅ Hom_O(O1, O2)')" class="symbol-btn f3-btn" title="5. Hom-биекция проводимости">5. Hom_P ≅ Hom_O</button>
            <button onclick="insert('ε : Φ_o ∘ Φ_z → Id')" class="symbol-btn f3-btn" title="6. Коединица сопряжения ε">6. ε-подключатель</button>
            <button onclick="insert('R_min (АЯ5, 5% конструкции)')" class="symbol-btn f3-btn" title="7. Начальный объект">7. R_min (АЯ5)</button>
            <button onclick="insert('!∃ m : R_min → X')" class="symbol-btn f3-btn" title="8. Единственность морфизма">8. Единств. m: R_min→X</button>
            <button onclick="insert('(ε Φ_o) ∘ (Φ_o η) = id_Φ_o')" class="symbol-btn f3-btn" title="9. Треугольное зигзаг-тождество">9. Зигзаг (ε Φ_o)∘(Φ_o η)=id</button>

            <!-- Шенноновский блок -->
            <button onclick="insert('I(U; I) = H(U) - H(U|I)')" class="symbol-btn f3-btn" title="10. Взаимная информация">10. I(U; I) = H(U) - H(U|I)</button>
            <button onclick="insert('H(U|I) → 0')" class="symbol-btn f3-btn" title="11. Идеальный резонансный проход">11. H(U|I) → 0</button>
            <button onclick="insert('C_R = B_R * log2(1 + SNR_R)')" class="symbol-btn f3-btn" title="12. Пропускная способность">12. C_R = B_R log2(1+SNR)</button>
            <button onclick="insert('S(x) = -log2(P(x))')" class="symbol-btn f3-btn" title="13. Сюрпризность хвоста Гаусса">13. S(x) = -log2 P(x)</button>
            <button onclick="insert('S(x_1) - S_Q(x_1)')" class="symbol-btn f3-btn" title="14. Дифференциальная сюрпризность">14. ΔS = S(x_1) - S_Q(x_1)</button>
            <button onclick="insert('D_KL(P_ε || Q)')" class="symbol-btn f3-btn" title="15. Расстояние Кульбака-Лейблера">15. D_KL(P_ε || Q)</button>
            <button onclick="insert('μ* = x_1')" class="symbol-btn f3-btn" title="16. Перецентровка системы">16. μ* = x_1</button>

            <!-- Параметры третьего цеха -->
            <button onclick="insert('R_нс')" class="symbol-btn f3-btn">17. R_нс</button>
            <button onclick="insert('I_нс')" class="symbol-btn f3-btn">18. I_нс</button>
            <button onclick="insert('Q1_пс')" class="symbol-btn f3-btn">19. Q1_пс</button>
            <button onclick="insert('Q2_пс')" class="symbol-btn f3-btn">20. Q2_пс</button>
            <button onclick="insert('U_сби')" class="symbol-btn f3-btn">21. U_сби</button>
            <button onclick="insert('R_min')" class="symbol-btn f3-btn">22. R_min</button>
            <button onclick="insert('O')" class="symbol-btn f3-btn">23. O (Объекты)</button>
            <button onclick="insert('P')" class="symbol-btn f3-btn">24. P (Проекции)</button>
            <button onclick="insert('Φ_z')" class="symbol-btn f3-btn">25. Φ_z</button>
            <button onclick="insert('Φ_o')" class="symbol-btn f3-btn">26. Φ_o</button>
            <button onclick="insert('ε')" class="symbol-btn f3-btn">27. ε (Эпсилон)</button>
            <button onclick="insert('η')" class="symbol-btn f3-btn">28. η (Эта)</button>
            <button onclick="insert('Hom')" class="symbol-btn f3-btn">29. Hom</button>
            <button onclick="insert('H(U)')" class="symbol-btn f3-btn">30. H(U)</button>
            <button onclick="insert('H(U|I)')" class="symbol-btn f3-btn">31. H(U|I)</button>
            <button onclick="insert('I(U; I)')" class="symbol-btn f3-btn">32. I(U; I)</button>
            <button onclick="insert('B_R')" class="symbol-btn f3-btn">33. B_R</button>
            <button onclick="insert('SNR_R')" class="symbol-btn f3-btn">34. SNR_R</button>
            <button onclick="insert('S(x)')" class="symbol-btn f3-btn">35. S(x)</button>
            <button onclick="insert('P(x)')" class="symbol-btn f3-btn">36. P(x)</button>
            <button onclick="insert('Q(x)')" class="symbol-btn f3-btn">37. Q(x)</button>
            <button onclick="insert('P_ε(x)')" class="symbol-btn f3-btn">38. P_ε(x)</button>
            <button onclick="insert('D_KL')" class="symbol-btn f3-btn">39. D_KL</button>
            <button onclick="insert('μ*')" class="symbol-btn f3-btn">40. μ*</button>
        </div>

        <!-- ПАНЕЛЬ: ФОРМУЛЫ -->
        <div id="panel-formulas" class="panel scroll-row custom-scrollbar">
            <button onclick="insert('U = A / (Q1 - Q2)')" class="symbol-btn formula-btn">U=A/(Q1-Q2)</button>
            <button onclick="insert('y = F(x)')" class="symbol-btn formula-btn">y=F(x)</button>
            <button onclick="insert('x → gradF → F → F\' → y')" class="symbol-btn formula-btn">x→gradF→F→F'→y</button>
            <button onclick="insert('Q*=fo/∆f=ωL/R=1/(ωRC)')" class="symbol-btn formula-btn">Q*=fo/∆f=ωL/R=1/(ωRC)</button>
            <button onclick="insert('Q*=(1/R)×√(L/C)')" class="symbol-btn formula-btn">Q*=(1/R)×√(L/C)</button>
            <button onclick="insert('Q*=fo/∆f')" class="symbol-btn formula-btn">Q*=fo/∆f</button>
            <button onclick="insert('I=Uчши/R=Q_тхл_рб/∆t →')" class="symbol-btn formula-btn">I=Uчши/R=Q_тхл_рб/∆t →</button>
            <button onclick="insert('I=Uсби×Gрезонансное=Q_ая5×f;')" class="symbol-btn formula-btn">I=Uсби×Gрезонансное=Q_ая5×f;</button>
            <button onclick="insert('dy/dx=F(x,y) или (x,y)→dy/dx')" class="symbol-btn formula-btn">фду dy/dx=F(x,y)</button>
            <button onclick="insert('x→∇F→F→F\' → y;')" class="symbol-btn formula-btn">x→∇F→F→F'→y;</button>
            <button onclick="insert('Q1→U→R→I→Q2')" class="symbol-btn formula-btn">Q1→U→R→I→Q2</button>
            <button onclick="insert('Q1-U, U-R, R-I, I-Q2')" class="symbol-btn formula-btn">Q1-U, U-R, R-I, I-Q2</button>
            <button onclick="insert('Q1-U')" class="symbol-btn formula-btn">Q1-U</button>
            <button onclick="insert('U-R')" class="symbol-btn formula-btn">U-R</button>

    <!-- ПОЛОСА ДЕЙСТВИЙ — всегда сразу над полем набора -->
    <div class="px-2 py-1.5 border-b border-slate-200 bg-white flex gap-1.5 items-center justify-end shrink-0">
        <!-- ГОЛУБАЯ КНОПКА СКАЧИВАНИЯ HTML ПРОГРАММЫ -->
        <button onclick="downloadSelf()" class="header-btn btn-sky" title="Скачать HTML файл программы">
            <i class="fas fa-file-code mr-1"></i> <span class="text-[10px]">HTML</span>
        </button>
        <button onclick="undoAction()" class="header-btn btn-slate" title="Назад">
            <i class="fas fa-undo"></i>
        </button>
        <button onclick="showClearModal()" class="header-btn btn-red" title="Сброс">
            <i class="fas fa-trash"></i>
        </button>
        <button onclick="copyToClipboard()" class="header-btn btn-orange" title="Копировать">
            <i class="fas fa-copy"></i>
        </button>
    </div>

    <!-- ТЕКСТОВОЕ ПОЛЕ -->
    <textarea id="mainEditor" placeholder="Верстак готов..." spellcheck="false"></textarea>

    <!-- МОДАЛКА СБРОСА -->
    <div id="confirmModal">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-xs w-full text-center border border-slate-200">
            <h3 class="font-black text-slate-900 mb-2 uppercase text-[12px] tracking-widest">Очистить всё?</h3>
            <div class="flex gap-2 mt-4">
                <button onclick="hideClearModal()" class="flex-1 py-3 bg-slate-100 rounded-xl font-bold text-[10px] uppercase">Отмена</button>
                <button onclick="confirmClear()" class="flex-1 py-3 bg-red-500 text-white rounded-xl font-bold text-[10px] uppercase shadow-lg shadow-red-100">Сбросить</button>
            </div>
        </div>
    </div>

    <!-- УВЕДОМЛЕНИЕ -->
    <div id="toast" class="toast bg-slate-900 text-white px-4 py-2 rounded-lg font-bold shadow-xl flex items-center gap-2 border border-slate-700">
        <i id="toastIcon" class="fas fa-check text-orange-500 text-xs"></i>
        <span id="toastMsg" class="text-[9px] uppercase tracking-wider">Скопировано</span>
    </div>

    <script>
        const editor = document.getElementById('mainEditor');
        const toast = document.getElementById('toast');
        const modal = document.getElementById('confirmModal');
        const STORAGE_VERSION = 'v20_f3';
        let historyStack = [];

        window.onload = () => {
            const saved = localStorage.getItem('jpb_pro_compact_' + STORAGE_VERSION);
            if (saved) { editor.value = saved; historyStack.push(saved); } else { historyStack.push(""); }
            
            // По умолчанию открыть панель Ф3 при старте
            const f3Btn = document.querySelector('.cat-f3');
            if (f3Btn) togglePanel('panel-f3', f3Btn);
            
            editor.focus();
        };

        function pushState() {
            const current = editor.value;
            if (historyStack[historyStack.length - 1] !== current) {
                historyStack.push(current);
                if (historyStack.length > 50) historyStack.shift();
                localStorage.setItem('jpb_pro_compact_' + STORAGE_VERSION, current);
            }
        }

        editor.addEventListener('input', pushState);

        function undoAction() {
            if (historyStack.length > 1) {
                historyStack.pop();
                const prevState = historyStack[historyStack.length - 1];
                editor.value = prevState;
                localStorage.setItem('jpb_pro_compact_' + STORAGE_VERSION, prevState);
                editor.focus();
            }
        }

        function insert(sym) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value;
            const val = (sym.length > 2) ? ` ${sym} ` : sym;
            editor.value = text.substring(0, start) + val + text.substring(end);
            const newPos = start + val.length;
            editor.setSelectionRange(newPos, newPos);
            editor.focus();
            pushState();
        }

        function togglePanel(panelId, btn) {
            const panel = document.getElementById(panelId);
            const isOpen = panel.classList.contains('open');

            // Закрыть все панели и снять активность со всех кнопок
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));

            // Если панель была закрыта — открыть её
            if (!isOpen) {
                panel.classList.add('open');
                btn.classList.add('active');
            }
            editor.focus();
        }

        function downloadSelf() {
            try {
                const docContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
                const blob = new Blob([docContent], { type: 'text/html;charset=utf-8;' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'jpb_math_pad_f3_' + Date.now() + '.html';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                showToast("ФАЙЛ HTML СКАЧАН", "fa-file-download");
            } catch (err) {
                alert("Сбой сохранения. Скопируй код вручную.");
            }
        }

        function copyToClipboard() {
            if (!editor.value) return;
            const el = document.createElement('textarea');
            el.value = editor.value;
            el.setAttribute('readonly', ''); 
            el.style.position = 'absolute'; 
            el.style.left = '-9999px';
            document.body.appendChild(el); 
            el.select(); 
            document.execCommand('copy'); 
            document.body.removeChild(el);
            showToast("В БУФЕРЕ", "fa-check");
        }

        function showToast(msg, icon) {
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').className = `fas ${icon} text-orange-500 text-xs`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1500);
        }

        function showClearModal() { if (editor.value.trim().length > 0) modal.style.display = 'flex'; }
        function hideClearModal() { modal.style.display = 'none'; }
        function confirmClear() { editor.value = ''; pushState(); hideClearModal(); editor.focus(); }

        document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    </script>

</body></html>
